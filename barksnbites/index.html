  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: linear-gradient(160deg, #ED6565 0%, #F9A09B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 16px 40px;
    }

    /* Top bar */
    .topbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .topbar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: background 0.2s;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.25); }

    /* Card */
    .card {
      width: 100%;
      max-width: 480px;
      background: #F3F1EC;
      border-radius: 24px;
      padding: 32px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Profile */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      border: 3px solid #ED6565;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .avatar svg {
      width: 68px;
      height: 68px;
    }

    .handle {
      font-size: 20px;
      font-weight: 700;
      color: #111225;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .bio {
      font-size: 13px;
      color: #57534e;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 16px;
      max-width: 300px;
    }

    /* Social icons row */
    .socials {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(17,18,37,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #111225;
      transition: background 0.2s, transform 0.15s;
    }
    .social-icon:hover { background: rgba(17,18,37,0.15); transform: scale(1.08); }

    /* Link buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-row {
      position: relative;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1.5px solid rgba(237,101,101,0.35);
      border-radius: 12px;
      overflow: visible;
      transition: border-color 0.2s, transform 0.15s;
    }
    .link-row:hover { border-color: #ED6565; transform: translateY(-1px); }

    .link-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      text-decoration: none;
      min-height: 56px;
    }

    .link-icon-wrap {
      width: 54px;
      min-width: 54px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(237,101,101,0.15);
    }

    .link-icon-wrap img,
    .link-icon-wrap svg {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: cover;
    }

    .link-label {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #ED6565;
      padding-right: 48px;
    }

    .link-menu-btn {
      position: absolute;
      right: 0;
      top: 0;
      width: 48px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: #a8a29e;
      border-radius: 0 12px 12px 0;
      transition: background 0.15s, color 0.15s;
      z-index: 1;
    }
    .link-menu-btn:hover { background: rgba(237,101,101,0.07); color: #ED6565; }

    /* Share popup overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,18,37,0.55);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .share-sheet {
      width: 100%;
      max-width: 480px;
      background: #F3F1EC;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 36px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .overlay.open .share-sheet {
      transform: translateY(0);
    }

    .share-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .share-title {
      font-size: 16px;
      font-weight: 700;
      color: #111225;
    }
    .share-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(17,18,37,0.08);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #57534e;
    }
    .share-close:hover { background: rgba(17,18,37,0.15); }

    .share-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(17,18,37,0.08);
    }
    .share-preview-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fde8e8;
      flex-shrink: 0;
    }
    .share-preview-text { flex: 1; min-width: 0; }
    .share-preview-name {
      font-size: 14px;
      font-weight: 600;
      color: #111225;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .share-preview-url {
      font-size: 12px;
      color: #a8a29e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .share-btn-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      background: #111225;
      color: #F3F1EC;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .share-btn-primary:hover { opacity: 0.88; }
    .share-btn-primary.copied { background: #22c55e; }

    .share-icons-row {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
    }

    .share-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: none;
      color: #57534e;
    }
    .share-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid rgba(17,18,37,0.1);
      transition: transform 0.15s;
    }
    .share-icon-btn:hover .share-icon-circle { transform: scale(1.06); }
    .share-icon-label { font-size: 11px; color: #a8a29e; }

    /* Global share button */
    .global-share {
      margin-top: 20px;
    }
  </style>

  <!-- Firebase Analytics (CDN, module) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
    import { getAnalytics, logEvent, setUserProperties } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-analytics.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBXL1WEMqP80fIGYSHX0fL73QlbdPk64ys",
      authDomain: "barksaccountant.firebaseapp.com",
      projectId: "barksaccountant",
      storageBucket: "barksaccountant.firebasestorage.app",
      messagingSenderId: "424475863507",
      appId: "1:424475863507:web:28fbab45db74b6cd8ae726",
      measurementId: "G-LP3JCLM034"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // Read UTM params once
    const params = new URLSearchParams(window.location.search);
    const utmSource   = params.get('utm_source')   || '(direct)';
    const utmMedium   = params.get('utm_medium')   || '(none)';
    const utmCampaign = params.get('utm_campaign') || '(none)';

    // Expose analytics helpers to global scope
    window._analytics = analytics;
    window._logEvent = logEvent;
    window._utmSource = utmSource;
    window._utmMedium = utmMedium;
    window._utmCampaign = utmCampaign;

    // Page view
    logEvent(analytics, 'page_view', {
      page_title: 'barksnbites',
      page_location: window.location.href,
      utm_source: utmSource,
      utm_medium: utmMedium,
      utm_campaign: utmCampaign
    });

    if (utmSource !== '(direct)') {
      setUserProperties(analytics, { last_utm_source: utmSource });
    }
  </script>

  <script>
    // State
    let currentLink = null;

    // Show native share button if supported
    if (navigator.share) {
      document.getElementById('nativeShareBtn').style.display = 'flex';
    }

    function getUtm() {
      return {
        utm_source:   window._utmSource   || '(direct)',
        utm_medium:   window._utmMedium   || '(none)',
        utm_campaign: window._utmCampaign || '(none)'
      };
    }

    function trackClick(linkName) {
      if (!window._analytics || !window._logEvent) return;
      window._logEvent(window._analytics, 'link_click', { link_name: linkName, ...getUtm() });
    }

    function trackShare(method) {
      if (!window._analytics || !window._logEvent) return;
      window._logEvent(window._analytics, 'share', { link_name: currentLink?.id || '', method, ...getUtm() });
    }

    function openShare(id, name, url) {
      currentLink = { id, name, url };
      document.getElementById('sharePreviewName').textContent = name;
      document.getElementById('sharePreviewUrl').textContent = url.replace('https://', '');
      document.getElementById('shareWA').href = `https://wa.me/?text=${encodeURIComponent(url)}`;
      document.getElementById('shareX').href  = `https://x.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(name + ' — barksnbites')}`;
      document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
      document.getElementById('copyBtnText').textContent = 'Copiar link';
      document.getElementById('copyBtn').classList.remove('copied');
      document.getElementById('shareOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeShare() {
      document.getElementById('shareOverlay').classList.remove('open');
      document.body.style.overflow = '';
      currentLink = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('shareOverlay')) closeShare();
    }

    async function copyLink() {
      if (!currentLink) return;
      try {
        await navigator.clipboard.writeText(currentLink.url);
        document.getElementById('copyBtnText').textContent = '¡Copiado!';
        document.getElementById('copyBtn').classList.add('copied');
        trackShare('copy');
        setTimeout(() => {
          document.getElementById('copyBtnText').textContent = 'Copiar link';
          document.getElementById('copyBtn').classList.remove('copied');
        }, 2000);
      } catch {
        document.getElementById('copyBtnText').textContent = currentLink.url;
      }
    }

    async function nativeShare() {
      if (!currentLink || !navigator.share) return;
      try {
        await navigator.share({ title: currentLink.name, url: currentLink.url });
        trackShare('native');
      } catch {}
    }

    function shareGlobal() {
      openShare('page', '@barksnbites', window.location.href.split('?')[0]);
    }


    // Keyboard close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeShare();
    });
  </script>
